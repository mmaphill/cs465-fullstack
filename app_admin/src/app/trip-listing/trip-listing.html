<!-- <pre>{{ trips | json }}</pre> -->
@if (trips && trips.length > 0) {
  <div>
    <button (click)="addTrip()" class="butn btn-info">Add Trip</button>
  </div>
  <div class="row">
    <div *ngFor="let trip of trips" class="col-md-4">
      <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
    </div>
  </div>
} @else {
  <p>Loading trips... </p>
}
